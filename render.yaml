# Render Blueprint — provisions the whole stack in one click.
# In Render: New → Blueprint → point at this repo. You'll be prompted for the
# secret env vars marked `sync: false` (ANTHROPIC_API_KEY, APP_PASSWORD).
#
# Note: Render's free Postgres expires ~90 days after creation.

databases:
  - name: chess-coach-db
    plan: free

services:
  # Backend: FastAPI in Docker (so Stockfish is available).
  - type: web
    name: chess-coach-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-coach-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false      # set in dashboard — your Claude key
      - key: APP_PASSWORD
        sync: false      # set in dashboard — the password you share with users
      - key: CORS_ORIGINS
        sync: false      # set to your frontend URL once it's deployed

  # Frontend: static React build served by Render's CDN.
  - type: web
    name: chess-coach-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false      # set to the backend URL, e.g. https://chess-coach-api.onrender.com
    routes:
      # SPA fallback so client-side paths resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
